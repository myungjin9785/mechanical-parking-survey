document.head.appendChild(s);

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function initMap(){
  if (!places.length) return;
  const center = new kakao.maps.LatLng(places[0].lat, places[0].lon);
  const map = new kakao.maps.Map(document.getElementById('map'), {center, level:7});
  const bounds = new kakao.maps.LatLngBounds();
  let openOverlay = null;

  places.forEach(p => {
    const pos = new kakao.maps.LatLng(p.lat, p.lon);
    bounds.extend(pos);
    const markerEl = document.createElement('div');
    markerEl.className='num-marker todo';
    markerEl.textContent=p.no;
    markerEls.set(String(p.no), markerEl);
    applyMarkerStatus(p.no);
    const overlay = new kakao.maps.CustomOverlay({position:pos, content:markerEl, yAnchor:1});
    overlay.setMap(map);

    markerEl.addEventListener('click', () => {
      if (openOverlay) openOverlay.setMap(null);
      const destination = encodeURIComponent((p.name || ('주차장 '+p.no))) + ',' + p.lat + ',' + p.lon;
      const content = document.createElement('div');
      content.className='info';
      content.innerHTML =
        '<button type="button" class="close-btn" aria-label="닫기">×</button>'+
        '<div class="no">No. '+esc(p.no)+'</div>'+
        '<div class="name">'+esc(p.name || '기계식주차장')+'</div>'+
        '<div class="addr">'+esc(p.address || '')+'</div>'+
        '<div class="coords">'+
        '위도(Y): '+Number(p.lat).toFixed(6)+'<br>'+
        '경도(X): '+Number(p.lon).toFixed(6)+
        '</div>'+
        '<a href="https://map.kakao.com/link/to/'+destination+'" target="_blank" rel="noopener">🚗 자동차 길찾기</a>'+
        '<button class="status-btn"></button>';
      const closeBtn = content.querySelector('.close-btn');
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (openOverlay) {
          openOverlay.setMap(null);
          openOverlay = null;
        }
      });
      const btn = content.querySelector('.status-btn');
      const refreshBtn = () => {
        const done = statusMap.get(Number(p.no)) === true;
        btn.textContent = done ? '↩ 완료 취소' : '✓ 조사 완료';
        btn.className = 'status-btn ' + (done ? 'done' : 'todo');
      };
      refreshBtn();
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        const next = !(statusMap.get(Number(p.no)) === true);
        await setCompleted(p.no, next);
        btn.disabled = false;
      });
      content._refreshStatusButton = refreshBtn;
      openOverlay = new kakao.maps.CustomOverlay({position:pos, content, yAnchor:1.15, zIndex:20});
      openOverlay.setMap(map);
      map.panTo(pos);
    });
  });
  map.setBounds(bounds);

  loadStatuses();

  sb.channel('survey-status-live')
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'survey_status' },
      payload => {
        const no = Number(payload.new.no);
        const before = statusMap.get(no) === true;
        const after = payload.new.completed === true;
        statusMap.set(no, after);
        if (before !== after) completedCount += after ? 1 : -1;
        renderCount();
        applyMarkerStatus(no);
        if (openOverlay) {
          const node = openOverlay.getContent();
          if (node && node._refreshStatusButton) node._refreshStatusButton();
        }
      })
    .subscribe();
}
</script>
</body>
</html>
